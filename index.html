<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Закрытая страница</title>
<style>
  :root { --bg: #14130f; --fg: #efe9dc; --muted: #a79f8e; --accent: #d9b36a; --line: #3a362c; --err: #e58a7a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 Georgia, "Times New Roman", serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 26px; font-weight: 400; margin: 0 0 8px; text-wrap: balance; }
  p { margin: 0 0 20px; color: var(--muted); }
  label { display: block; font: 13px/1.3 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  input { width: 100%; padding: 14px 16px; font: 18px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--fg);
    background: #1d1b16; border: 1px solid var(--line); border-radius: 10px; outline: none; }
  input:focus { border-color: var(--accent); }
  button { margin-top: 14px; width: 100%; padding: 14px 16px; font: 600 16px/1.2 system-ui, sans-serif; color: #1a1710;
    background: var(--accent); border: 0; border-radius: 999px; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  #msg { min-height: 1.5em; margin: 14px 0 0; font: 15px/1.4 system-ui, sans-serif; color: var(--muted); }
  #msg.err { color: var(--err); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font: 14px/1.3 system-ui, sans-serif; color: var(--muted); }
  .row input { width: auto; }
</style>
</head>
<body>
<main>
  <h1>Семейная книга</h1>
  <p>Страница закрыта паролем. Его знают только свои.</p>
  <form id="f">
    <input type="text" name="username" autocomplete="username" value="Семейная книга" hidden>
    <label for="p">Пароль</label>
    <input id="p" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" required>
    <div class="row"><input id="show" type="checkbox"><label for="show" style="margin:0;text-transform:none;letter-spacing:0;font-size:14px">показать пароль</label></div>
    <button id="b" type="submit">Открыть</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  'use strict';
  var f = document.getElementById('f'), p = document.getElementById('p'), b = document.getElementById('b'), msg = document.getElementById('msg');
  var say = function (t, err) { msg.textContent = t; msg.className = err ? 'err' : ''; };
  document.getElementById('show').addEventListener('change', function (e) { p.type = e.target.checked ? 'text' : 'password'; });
  var b64 = function (buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  var unb64 = function (s) { var t = atob(s), u = new Uint8Array(t.length); for (var i = 0; i < t.length; i++) u[i] = t.charCodeAt(i); return u; };
  var ss = { get: function (k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
             set: function (k, v) { try { sessionStorage.setItem(k, v); return true; } catch (e) { return false; } },
             del: function (k) { try { sessionStorage.removeItem(k); } catch (e) {} } };
  // та же нормализация, что в build.js: пробелы, любые тире и знаки между группами — один дефис
  var norm = function (s) { return s.normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, ''); };
  var BAD = 'Здесь книга не откроется. Нажмите на три точки (или значок компаса) в углу экрана и выберите «Открыть в Chrome» или «Открыть в браузере». Режим инкогнито тоже не подойдёт.';
  if (!('serviceWorker' in navigator) || !window.crypto || !crypto.subtle) { say(BAD, true); b.disabled = true; p.disabled = true; return; }
  // если ключ уже есть в этой вкладке — отвечаем на запросы сервис-воркера
  navigator.serviceWorker.addEventListener('message', function (ev) {
    if (!ev.source || ev.source.scriptURL !== new URL('sw.js', location.href).href) return;
    var d = ev.data || {}, raw = ss.get('k');
    if (d.type === 'need-key' && raw && ev.ports && ev.ports[0]) ev.ports[0].postMessage({ raw: unb64(raw).buffer });
    else if (d.type === 'bad-key') ss.del('k');
  });
  function within(pr, ms, why) {
    return new Promise(function (res, rej) {
      var t = setTimeout(function () { rej(new Error(why)); }, ms);
      pr.then(function (v) { clearTimeout(t); res(v); }, function (e) { clearTimeout(t); rej(e); });
    });
  }
  // ready даёт регистрацию с действующим воркером; ждать controllerchange незачем — ключ можно послать и не управляющему воркеру
  function worker() {
    return within(navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }), 20000, 'sw')
      .then(function (reg) { var w = reg.active || navigator.serviceWorker.controller; if (!w) throw new Error('sw'); return w; },
            function () { throw new Error('sw'); });
  }
  function send(sw, data) {
    return new Promise(function (res) {
      var ch = new MessageChannel(), t = setTimeout(function () { ch.port1.close(); res({ ok: false, why: 'net' }); }, 30000);
      ch.port1.onmessage = function (ev) { clearTimeout(t); ch.port1.close(); res(ev.data || { ok: false, why: 'net' }); };
      try { sw.postMessage(data, [ch.port2]); } catch (e) { clearTimeout(t); res({ ok: false, why: 'net' }); }
    });
  }
  function unlock(raw) { return worker().then(function (sw) { return send(sw, { type: 'key', raw: raw.slice(0) }); }); }
  // replace, а не href: страница входа не остаётся в истории, «Назад» из книги не приводит к форме пароля
  function clearPw() { p.value = ''; p.type = 'password'; var c = document.getElementById('show'); if (c) c.checked = false; }
  function enter() { clearPw(); say('Открываю…'); location.replace('book/' + location.hash); }
  function fail(err) {
    b.disabled = false;
    say(err && err.message === 'sw' && navigator.onLine !== false ? BAD : err && err.message === 'storage' ? 'Браузер не даёт сохранить ключ. Откройте ссылку в обычном окне Chrome или Safari.'
      : 'Нет связи с сайтом. Проверьте интернет и попробуйте ещё раз.', true);
  }
  // Ключ уже есть в этой вкладке (вкладку выгрузили из памяти, страницу обновили, пришли со страницы 404): пароль не спрашиваем.
  function resume() {
    var k = ss.get('k'); if (!k) return;
    var now = Date.now(), n = now - (+ss.get('t') || 0) < 15000 ? (+ss.get('n') || 0) : 0;   // защита от круга вход → книга → вход
    if (n >= 3) { ss.del('n'); say(BAD, true); return; }
    ss.set('n', String(n + 1)); ss.set('t', String(now));
    b.disabled = true; say('Открываю…');
    unlock(unb64(k).buffer).then(function (ans) {
      if (ans && ans.ok) return enter();
      b.disabled = false;
      if (ans && ans.why === 'key') { ss.del('k'); say('Введите пароль ещё раз.'); }
      else say('Нет связи с сайтом. Проверьте интернет и обновите страницу.', true);
    }, fail);
  }
  window.addEventListener('pageshow', function (e) { if (e.persisted) { clearPw(); b.disabled = false; say(''); resume(); } });
  resume();
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var pass = norm(p.value);
    if (!pass) return;
    if (/[а-яё]/.test(pass)) { say('Пароль пишется английскими буквами. Переключите клавиатуру на English и наберите его заново.', true); p.select(); return; }
    b.disabled = true; say('Проверяю пароль…');
    var raw;
    fetch('c.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('cfg'); return r.json(); }).then(function (cfg) {
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']).then(function (k) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(cfg.s), iterations: cfg.i }, k, 256);
      });
    }).then(function (bits) { raw = bits; return unlock(raw); }).then(function (ans) {
      if (ans && ans.ok) {
        if (!ss.set('k', b64(raw))) throw new Error('storage');
        ss.del("n"); enter();
      } else if (ans && ans.why === 'key') { b.disabled = false; say('Пароль не подошёл. Проверьте его и попробуйте ещё раз.', true); p.select(); }
      else throw new Error('net');
    }).catch(fail);
  });
})();
</script>
</body>
</html>
